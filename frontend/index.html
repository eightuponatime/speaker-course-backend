<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#0a0a0b" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=umbra-1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Oswald:wght@500;600&family=Manrope:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>UMBRA — школа чёрной риторики</title>
    <style>
      html { background:#0a0a0b; }
      body { margin:0; }
      html:has(.umbra-preload) { background:#0a0a0b; }
    </style>
    <!-- preload-styles -->
  </head>
  <body>
    <div id="root">
      <!-- React replaces this with the same loader until the application is ready. -->
      <main class="umbra-preload" aria-busy="true" aria-label="Загрузка сайта">
        <div class="umbra-preload-brand">
          <svg width="58" height="58" viewBox="0 0 260 260" aria-hidden="true">
            <defs><clipPath id="initial-umbra-logo"><circle cx="130" cy="130" r="108" /></clipPath></defs>
            <circle cx="130" cy="130" r="108" fill="#C8102E" />
            <circle cx="130" cy="104" r="112" fill="#0A0A0B" clip-path="url(#initial-umbra-logo)" />
            <circle cx="130" cy="130" r="108" fill="none" stroke="#EDE8DF" stroke-width="10" />
          </svg>
          <div>
            <strong>UMBRA</strong>
            <span>Искусство влияния</span>
          </div>
        </div>
        <div class="umbra-preload-bar" aria-hidden="true"></div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
